<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Planning - {{ monday }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <style>
      :root { --page-bg: #f5f7f3; --ink: #223027; --accent: #276749; }
      body { background: var(--page-bg); color: var(--ink); }
      .page-shell { max-width: 1180px; }
      .week-header { margin-bottom: 1.25rem; }
      .week-heading { display: flex; align-items: center; gap: .75rem; }
      .week-heading > div { min-width: 0; }
      .week-heading h1 { font-size: clamp(1.3rem, 5vw, 2rem); line-height: 1.15; }
      .week-nav { display: grid; place-items: center; flex: none; width: 44px; height: 44px; border: 1px solid #d9e1d9; border-radius: 14px; background: white; color: var(--accent); text-decoration: none; font-size: 1.6rem; }
      .week-nav:hover { color: #194c34; background: #eef5ef; }
      .day-card { min-width: 0; border: 1px solid #e1e8df; border-radius: 18px !important; overflow: hidden; margin-bottom: .75rem; box-shadow: 0 3px 14px rgba(28, 53, 35, .04); }
      .day-card .accordion-button { min-height: 74px; gap: .75rem; padding: 1rem; background: white; box-shadow: none; }
      .day-card .accordion-button:not(.collapsed) { color: var(--ink); background: #f0f6ef; }
      .day-card .accordion-button::after { margin-left: .25rem; flex: none; }
      .day-summary { min-width: 0; flex: 1; }
      .day-summary-title { font-size: 1rem; font-weight: 700; text-transform: capitalize; }
      .day-summary-meals { color: #65736a; font-size: .875rem; line-height: 1.4; overflow-wrap: anywhere; }
      .meal-panel { min-width: 0; padding: 1rem; border-top: 1px solid #e8eee6; overflow-wrap: anywhere; }
      .meal-panel:first-child { border-top: 0; }
      .meal-panel-heading { display: flex; align-items: center; gap: .5rem; flex-wrap: wrap; margin-bottom: .75rem; }
      .meal-panel-heading h3 { margin: 0 auto 0 0; font-size: 1rem; text-transform: capitalize; }
      .meal-actions { min-height: 44px; }
      .dish-remove { min-width: 44px; min-height: 44px; flex: none; }
      .shopping-card { border: 1px solid #e1e8df; border-radius: 18px; }
      .mobile-shopping { position: fixed; inset: auto 0 0; z-index: 1030; padding: .65rem 1rem calc(.65rem + env(safe-area-inset-bottom)); background: rgba(255,255,255,.97); border-top: 1px solid #dfe7dd; box-shadow: 0 -6px 20px rgba(28,53,35,.08); }
      .mobile-shopping button { min-height: 48px; }
      .loading { animation: pulse 0.9s ease-in-out infinite; }
      @keyframes pulse { 0% { background-color: #fff; } 50% { background-color: #f1f5f9; } 100% { background-color: #fff; } }
      @media (max-width: 991.98px) { body { padding-bottom: calc(5rem + env(safe-area-inset-bottom)); } }
      @media (min-width: 992px) { .week-header { margin-bottom: 1.75rem; } .day-card .accordion-button { padding: 1.15rem 1.35rem; } .meal-panel { padding: 1.25rem 1.35rem; } }
    </style>
  </head>
  <body>
    <div class="container page-shell py-3 py-lg-4">
      <header class="week-header">
        <div class="d-flex flex-wrap gap-3"><a class="small text-decoration-none fw-semibold" href="/meal-planning/">← Toutes les semaines</a><a class="small text-decoration-none fw-semibold" href="/mealie/catalog">Catalogue Mealie</a></div>
        <div class="week-heading mt-3">
          <a class="week-nav" id="previousWeek" href="#" aria-label="Semaine précédente">‹</a>
          <div class="flex-grow-1 text-center">
            <div class="small text-uppercase fw-semibold text-muted">Menu de la semaine</div>
            <h1 class="mb-0" id="weekTitle">Semaine du {{ monday }}</h1>
          </div>
          <a class="week-nav" id="nextWeek" href="#" aria-label="Semaine suivante">›</a>
        </div>
      </header>

      <div class="row g-3">
        <div class="col-12 col-lg-8">
          <div class="card border-0 bg-transparent">
            <div class="card-body p-0">
              <div id="err" class="text-danger small mb-2" style="display:none;"></div>
              <div class="accordion" id="planningAcc"></div>
            </div>
          </div>
        </div>

        <div class="col-12 col-lg-4">
          <div class="card shopping-card shadow-sm">
            <div class="card-body">
              <h2 class="h6 mb-2">Liste de courses</h2>
              <p class="text-muted small mb-3">Tous les ingrédients de la semaine, réunis au même endroit.</p>
              <div class="d-flex flex-wrap gap-2 align-items-center mb-2">
                <button class="btn btn-success" id="createList">Créer la liste de courses</button>
                <span id="listLink" class="text-muted small" style="display:none;"></span>
              </div>
              <div class="text-muted small" id="ingredientsCount"></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="mobile-shopping d-lg-none">
      <button class="btn btn-success w-100 fw-semibold" id="mobileShoppingAction" type="button">Liste de courses <span id="mobileShoppingCount"></span></button>
    </div>

    <div class="modal fade" id="mealiePicker" tabindex="-1" aria-labelledby="mealiePickerLabel" aria-hidden="true">
      <div class="modal-dialog modal-dialog-scrollable modal-fullscreen-sm-down">
        <div class="modal-content">
          <div class="modal-header">
            <h2 class="modal-title h5" id="mealiePickerLabel">Choisir une recette Mealie</h2>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fermer"></button>
          </div>
          <div class="modal-body">
            <input class="form-control mb-3" id="mealiePickerSearch" type="search" placeholder="Rechercher une recette" aria-label="Rechercher une recette Mealie" />
            <div class="list-group" id="mealiePickerList"></div>
          </div>
        </div>
      </div>
    </div>

    <div class="modal fade" id="regenModal" tabindex="-1" aria-labelledby="regenModalLabel" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="regenModalLabel">Nouvelle proposition (IA)</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fermer"></button>
          </div>
          <div class="modal-body">
            <div class="mb-3">
              <div class="form-check">
                <input class="form-check-input" type="radio" name="regenMode" id="regenModeVeg" value="vegetarien" checked>
                <label class="form-check-label" for="regenModeVeg">végétarien de saison</label>
              </div>
              <div class="form-check">
                <input class="form-check-input" type="radio" name="regenMode" id="regenModeGourmand" value="gourmand">
                <label class="form-check-label" for="regenModeGourmand">gourmand</label>
              </div>
              <div class="form-check">
                <input class="form-check-input" type="radio" name="regenMode" id="regenModeInspire" value="inspire">
                <label class="form-check-label" for="regenModeInspire">inspiré</label>
              </div>
            </div>
            <div id="regenIngredientsWrap" class="mb-2" style="display:none;">
              <label class="form-label small" for="regenIngredients">Ingrédients obligatoires (séparés par des virgules)</label>
              <input type="text" class="form-control form-control-sm" id="regenIngredients" placeholder="ex: courge, lentilles, feta">
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-outline-secondary btn-sm" data-bs-dismiss="modal">Annuler</button>
            <button type="button" class="btn btn-primary btn-sm" id="regenConfirm">Proposer</button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      const monday = "{{ monday }}";
      const acc = document.getElementById("planningAcc");
      const err = document.getElementById("err");
      const listLink = document.getElementById("listLink");
      const createBtn = document.getElementById("createList");
      const ingredientsCount = document.getElementById("ingredientsCount");
      const mobileShoppingAction = document.getElementById("mobileShoppingAction");
      const mobileShoppingCount = document.getElementById("mobileShoppingCount");

      let allIngredients = [];
      let planningData = [];
      let currentOpenDay = null;
      let hasSavedList = false;
      let mealieRecipes = [];
      let mealieMatches = new Map();
      let pendingRegenIdx = null;
      let pendingRegenRow = null;
      let pickerIdx = null;
      let pickerRow = null;

      const weekStart = new Date(`${monday}T12:00:00`);
      const weekEnd = new Date(weekStart);
      weekEnd.setDate(weekStart.getDate() + 6);
      const dateLabel = (date, options) => new Intl.DateTimeFormat("fr-FR", options).format(date);
      const startLabel = dateLabel(weekStart, { day: "numeric", month: weekStart.getMonth() === weekEnd.getMonth() ? undefined : "long", year: weekStart.getFullYear() === weekEnd.getFullYear() ? undefined : "numeric" });
      const endLabel = dateLabel(weekEnd, { day: "numeric", month: "long", year: "numeric" });
      document.getElementById("weekTitle").textContent = `${startLabel} – ${endLabel}`;
      function shiftWeek(days) {
        const date = new Date(weekStart);
        date.setDate(date.getDate() + days);
        const iso = `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, "0")}-${String(date.getDate()).padStart(2, "0")}`;
        return `/meal-planning/${iso}`;
      }
      document.getElementById("previousWeek").href = shiftWeek(-7);
      document.getElementById("nextWeek").href = shiftWeek(7);

      const MEALIE_MATCH_MAX_DISTANCE = 100;
      const MEALIE_MATCH_MAX_RATIO = 0.05;

      function normalizeIngredient(s) {
        return (s || "").trim();
      }

      function normalizeText(s) {
        return (s || "")
          .toLowerCase()
          .normalize("NFD")
          .replace(/[\u0300-\u036f]/g, "")
          .replace(/[^a-z0-9]+/g, " ")
          .trim();
      }

      function damerauLevenshtein(a, b) {
        const s = a || "";
        const t = b || "";
        const m = s.length;
        const n = t.length;
        if (!m) return n;
        if (!n) return m;
        const d = Array.from({ length: m + 1 }, () => new Array(n + 1).fill(0));
        for (let i = 0; i <= m; i++) d[i][0] = i;
        for (let j = 0; j <= n; j++) d[0][j] = j;
        for (let i = 1; i <= m; i++) {
          for (let j = 1; j <= n; j++) {
            const cost = s[i - 1] === t[j - 1] ? 0 : 1;
            let val = Math.min(
              d[i - 1][j] + 1,
              d[i][j - 1] + 1,
              d[i - 1][j - 1] + cost
            );
            if (i > 1 && j > 1 && s[i - 1] === t[j - 2] && s[i - 2] === t[j - 1]) {
              val = Math.min(val, d[i - 2][j - 2] + cost);
            }
            d[i][j] = val;
          }
        }
        return d[m][n];
      }

      function getReceiptName(meal) {
        if (!meal || typeof meal !== "object") return "";
        const candidates = [
          meal.recette,
          meal.recette_name,
          meal.receipt,
          meal.receipt_name,
          meal.recipe,
          meal.recipe_name,
        ];
        for (const val of candidates) {
          if (typeof val !== "string") continue;
          const txt = val.trim();
          if (txt) return txt;
        }
        const plats = Array.isArray(meal.plats) ? meal.plats : [];
        if (typeof plats[0] === "string" && plats[0].trim()) {
          return plats[0].trim();
        }
        return "";
      }

      function findMealieMatch(name) {
        const target = normalizeText(name);
        if (!target) return null;
        let best = null;
        for (const recipe of mealieRecipes) {
          const candidateName = normalizeText(recipe && recipe.name ? recipe.name : "");
          if (!candidateName) continue;
          const dist = damerauLevenshtein(target, candidateName);
          const maxLen = Math.max(target.length, candidateName.length);
          const ratio = maxLen ? dist / maxLen : 1;
          if (dist > MEALIE_MATCH_MAX_DISTANCE || ratio > MEALIE_MATCH_MAX_RATIO) continue;
          if (!best || ratio < best.ratio || (ratio === best.ratio && dist < best.dist)) {
            best = { recipe, dist, ratio };
          }
        }
        return best;
      }

      function updateMealieMatchForIndex(idx) {
        const meal = planningData[idx];
        if (!meal) {
          mealieMatches.delete(idx);
          return;
        }
        const receiptName = getReceiptName(meal);
        if (!receiptName) {
          mealieMatches.delete(idx);
          return;
        }
        const match = findMealieMatch(receiptName);
        if (match) {
          mealieMatches.set(idx, match);
        } else {
          mealieMatches.delete(idx);
        }
      }

      function updateAllMealieMatches() {
        mealieMatches = new Map();
        planningData.forEach((_, idx) => updateMealieMatchForIndex(idx));
      }

      function getSelectedRegenMode() {
        const selected = document.querySelector('input[name="regenMode"]:checked');
        return selected ? selected.value : "vegetarien";
      }

      function openRegenModal(idx, rowEl) {
        pendingRegenIdx = idx;
        pendingRegenRow = rowEl || null;
        const modalEl = document.getElementById("regenModal");
        if (!modalEl) return;
        const veg = document.getElementById("regenModeVeg");
        if (veg) veg.checked = true;
        if (regenIngredientsInput) regenIngredientsInput.value = "";
        updateRegenIngredientsVisibility();
        const modal = bootstrap.Modal.getOrCreateInstance(modalEl);
        modal.show();
      }

      function computeAllIngredients(planning) {
        const agg = new Set();
        for (const meal of planning) {
          const src = Array.isArray(meal.ingredients) ? meal.ingredients : [];
          for (const raw of src) {
            const ing = normalizeIngredient(raw);
            if (ing) agg.add(ing);
          }
        }
        allIngredients = [...agg].sort((a, b) => a.localeCompare(b, "fr"));
        if (ingredientsCount) {
          ingredientsCount.innerHTML = `<span class="fw-semibold">${allIngredients.length}</span> ingrédient(s) détecté(s) dans le planning.`;
        }
        if (mobileShoppingCount) mobileShoppingCount.textContent = `· ${allIngredients.length} ingrédients`;
      }

      async function loadSavedListIfAny() {
        try {
          const r = await fetch(`/meal-planning/${encodeURIComponent(monday)}/shopping-list`, {
            headers: { "Accept": "application/json" }
          });
          if (r.status === 404) return;
          if (!r.ok) throw new Error("Impossible de charger la liste sauvegardée");
          const data = await r.json();
          const hasData = data && (Array.isArray(data.items) || Array.isArray(data.to_buy));
          if (!hasData) return;
          showListLink(`/meal-planning/${encodeURIComponent(monday)}/shopping-list`);
        } catch (e) {
          err.style.display = "block";
          err.textContent = "Liste sauvegardée non chargée: " + (e && e.message ? e.message : e);
        }
      }

      function ingredientPopoverContent(meal) {
        const src = Array.isArray(meal.courses) ? meal.courses : (Array.isArray(meal.ingredients) ? meal.ingredients : []);
        if (!src.length) return "<em>Aucun ingrédient</em>";
        return src.map(x => `• ${String(x)}`).join("<br/>");
      }

      function renderPlanning(planning, keepOpenIndex = null) {
        acc.innerHTML = "";
        const order = new Map([["lundi", 1], ["mardi", 2], ["mercredi", 3], ["jeudi", 4], ["vendredi", 5], ["samedi", 6], ["dimanche", 7]]);
        const mealOrder = new Map([["petit-dejeuner", 1], ["midi", 2], ["soir", 3], ["accompagnement", 4], ["collation", 5], ["boisson", 6], ["dessert", 7]]);
        const display = planning.map((m, idx) => ({ meal: m, idx }));
        display.sort((a, b) =>
          (order.get(a.meal.jour) || 999) - (order.get(b.meal.jour) || 999) ||
          (mealOrder.get(a.meal.repas) || 999) - (mealOrder.get(b.meal.repas) || 999)
        );
        const groups = new Map();
        display.forEach((item) => {
          const day = item.meal.jour || "autre";
          if (!groups.has(day)) groups.set(day, []);
          groups.get(day).push(item);
        });
        const today = new Date();
        const todayName = ["dimanche", "lundi", "mardi", "mercredi", "jeudi", "vendredi", "samedi"][today.getDay()];
        const currentWeek = today >= new Date(`${monday}T00:00:00`) && today < new Date(weekEnd.getFullYear(), weekEnd.getMonth(), weekEnd.getDate() + 1);
        const preferredDay = keepOpenIndex !== null ? planning[keepOpenIndex]?.jour : currentOpenDay || (currentWeek ? todayName : null);
        const targetDay = groups.has(preferredDay) ? preferredDay : groups.keys().next().value;

        groups.forEach((dayMeals, day) => {
          const itemId = `day-${day}`;
          const card = document.createElement("div");
          card.className = "accordion-item day-card";
          const header = document.createElement("h2");
          header.className = "accordion-header";
          const btn = document.createElement("button");
          btn.className = "accordion-button collapsed";
          btn.type = "button";
          btn.setAttribute("data-bs-toggle", "collapse");
          btn.setAttribute("data-bs-target", `#${itemId}`);
          btn.setAttribute("aria-controls", itemId);
          btn.addEventListener("click", () => { currentOpenDay = day; });
          const summary = document.createElement("div");
          summary.className = "day-summary";
          const title = document.createElement("div");
          title.className = "day-summary-title";
          const dayOffset = (order.get(day) || 1) - 1;
          const dayDate = new Date(weekStart);
          dayDate.setDate(weekStart.getDate() + dayOffset);
          title.textContent = dateLabel(dayDate, { weekday: "long", day: "numeric", month: "short" });
          summary.appendChild(title);
          dayMeals.forEach(({ meal }) => {
            const line = document.createElement("div");
            line.className = "day-summary-meals";
            const names = Array.isArray(meal.plats) ? meal.plats.join(", ") : "";
            line.textContent = `${meal.repas || "Repas"} · ${names || "À définir"}`;
            if (meal.mealie_plan_sync === true) {
              const source = document.createElement("span");
              source.className = "badge bg-success ms-2";
              source.textContent = "🍽️ Mealie";
              line.appendChild(source);
            }
            summary.appendChild(line);
          });
          btn.appendChild(summary);
          header.appendChild(btn);
          card.appendChild(header);
          const body = document.createElement("div");
          body.id = itemId;
          body.className = "accordion-collapse collapse";
          body.setAttribute("data-bs-parent", "#planningAcc");

          dayMeals.forEach(({ meal, idx }) => {
          const importedFromMealie = meal.mealie_plan_sync === true;
          const importedHint = "Repas importé du planning Mealie : modification désactivée";
          const inner = document.createElement("section");
          inner.className = "meal-panel";

          const topRow = document.createElement("div");
          topRow.className = "meal-panel-heading";

          const mealTitle = document.createElement("h3");
          mealTitle.textContent = meal.repas || "Repas";
          topRow.appendChild(mealTitle);

          const dur = document.createElement("span");
          dur.className = "text-muted small";
          dur.textContent = meal.duree_preparation_minutes ? `${meal.duree_preparation_minutes} min` : "";
          topRow.appendChild(dur);

          if (importedFromMealie) {
            const locked = document.createElement("span");
            locked.className = "small text-success fw-semibold";
            locked.textContent = "🍽️ Planifié dans Mealie";
            locked.title = importedHint;
            topRow.appendChild(locked);
          } else {
            const actions = document.createElement("div");
            actions.className = "dropdown ms-auto";
            const actionButton = document.createElement("button");
            actionButton.className = "btn btn-outline-success dropdown-toggle meal-actions";
            actionButton.type = "button";
            actionButton.setAttribute("data-bs-toggle", "dropdown");
            actionButton.setAttribute("aria-expanded", "false");
            actionButton.textContent = "Actions";
            actions.appendChild(actionButton);
            const menu = document.createElement("div");
            menu.className = "dropdown-menu dropdown-menu-end";
            function addAction(label, handler) {
              const item = document.createElement("button");
              item.type = "button";
              item.className = "dropdown-item py-2";
              item.textContent = label;
              item.addEventListener("click", handler);
              menu.appendChild(item);
            }
            addAction("Nouvelle proposition IA", () => openRegenModal(idx, card));
            addAction("Ajouter un plat Mealie au hasard", () => addRandomMealieDish(idx, card));
            if (mealieRecipes.length) addAction("Choisir une recette Mealie", () => openMealiePicker(idx, card));
            actions.appendChild(menu);
            topRow.appendChild(actions);
          }

          inner.appendChild(topRow);

          const plats = Array.isArray(meal.plats) ? meal.plats : [];
          const restes = Array.isArray(meal.restes) ? meal.restes : [];
          const ingredients = Array.isArray(meal.ingredients) ? meal.ingredients : [];

          function section(title, items, isPlat) {
            const wrap = document.createElement("div");
            wrap.className = "mb-2";
            const h = document.createElement("div");
            h.className = "fw-semibold";
            h.textContent = title;
            wrap.appendChild(h);
            const content = document.createElement("div");
            content.className = "text-muted small";
              if (!items || !items.length) {
                content.textContent = "—";
              } else {
                items.forEach((it) => {
                  const row = document.createElement("div");
                  if (isPlat) {
                    row.className = "d-flex align-items-center justify-content-between";
                  }
                  const left = document.createElement("span");
                  const linkedDish = isPlat && Array.isArray(meal.mealie_dishes)
                    ? meal.mealie_dishes.find((dish) => dish && dish.name === it && dish.slug)
                    : null;
                  const mealieSlug = linkedDish ? linkedDish.slug : (meal.plats.length === 1 ? meal.mealie_slug : null);
                  if (isPlat && mealieSlug) {
                    const a = document.createElement("a");
                    const base = "{{ mealie_url }}";
                    a.href = `${base}/g/home/r/${encodeURIComponent(mealieSlug)}`;
                    a.target = "_blank";
                    a.rel = "noopener noreferrer";
                    a.textContent = String(it);
                    left.textContent = "• ";
                    left.appendChild(a);
                  } else if (isPlat) {
                    const a = document.createElement("a");
                    a.href = "https://www.google.com/search?q=" + encodeURIComponent(String(it));
                    a.target = "_blank";
                    a.rel = "noopener noreferrer";
                    a.textContent = String(it);
                    left.textContent = "• ";
                    left.appendChild(a);
                  } else {
                    left.textContent = "• " + String(it);
                  }
                  row.appendChild(left);
                  if (isPlat) {
                    const del = document.createElement("button");
                    del.type = "button";
                    del.className = "btn btn-outline-danger btn-sm rounded-circle ms-2 dish-remove";
                    del.setAttribute("aria-label", `Supprimer ${String(it)}`);
                    del.textContent = "×";
                    del.disabled = importedFromMealie;
                    if (importedFromMealie) del.title = importedHint;
                    del.addEventListener("click", () => removeDish(idx, String(it)));
                    row.appendChild(del);
                  }
                  content.appendChild(row);
                });
              }
            wrap.appendChild(content);
            return wrap;
          }

          inner.appendChild(section("Plats", plats, true));
          inner.appendChild(section("Restes", restes, false));
          inner.appendChild(section("Ingrédients", ingredients, false));

          body.appendChild(inner);
          });
          card.appendChild(body);
          acc.appendChild(card);

          if (targetDay === day) {
            currentOpenDay = day;
            const collapse = new bootstrap.Collapse(body, { toggle: false });
            collapse.show();
          }
        });

        // Activer les popovers
        const popoverTriggerList = [].slice.call(document.querySelectorAll('[data-bs-toggle="popover"]'));
        popoverTriggerList.forEach(el => new bootstrap.Popover(el));
      }

      const pickerModalEl = document.getElementById("mealiePicker");
      const pickerSearch = document.getElementById("mealiePickerSearch");
      const pickerList = document.getElementById("mealiePickerList");

      function renderMealiePicker() {
        pickerList.innerHTML = "";
        const needle = normalizeText(pickerSearch.value);
        const matches = mealieRecipes.filter((recipe) => normalizeText(recipe?.name).includes(needle)).slice(0, 60);
        if (!matches.length) {
          const empty = document.createElement("p");
          empty.className = "text-muted";
          empty.textContent = "Aucune recette trouvée.";
          pickerList.appendChild(empty);
          return;
        }
        matches.forEach((recipe) => {
          const item = document.createElement("button");
          item.type = "button";
          item.className = "list-group-item list-group-item-action py-3";
          item.textContent = recipe.name;
          item.addEventListener("click", () => {
            if (!confirm(`Ajouter la recette Mealie « ${recipe.name} » à ce repas ?`)) return;
            bootstrap.Modal.getInstance(pickerModalEl)?.hide();
            addMealieDish(pickerIdx, pickerRow, recipe);
          });
          pickerList.appendChild(item);
        });
      }

      function openMealiePicker(idx, rowEl) {
        pickerIdx = idx;
        pickerRow = rowEl;
        pickerSearch.value = "";
        renderMealiePicker();
        bootstrap.Modal.getOrCreateInstance(pickerModalEl).show();
      }
      pickerSearch.addEventListener("input", renderMealiePicker);
      pickerModalEl.addEventListener("shown.bs.modal", () => pickerSearch.focus());

      async function persistCurrentList() {
        if (!allIngredients.length) {
          err.style.display = "block";
          err.textContent = "Aucun ingrédient à sauvegarder.";
          return null;
        }
        err.style.display = "none";
        const url = `/meal-planning/${encodeURIComponent(monday)}/shopping-list`;
        const r = await fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ items: allIngredients })
        });
        if (!r.ok) {
          let detail = r.status;
          try {
            const payload = await r.json();
            if (payload && payload.detail) detail = payload.detail;
          } catch (_) {}
          throw new Error("Sauvegarde impossible: " + detail);
        }
        showListLink(url);
        return url;
      }

      function showListLink(url) {
        hasSavedList = true;
        if (!listLink) return;
        listLink.style.display = "inline";
        listLink.innerHTML = `Liste créée : <a href="${url}">l’ouvrir</a>`;
        if (createBtn) createBtn.style.display = "none";
      }

      async function regenerateMeal(idx, rowEl, mode, ingredients) {
        err.style.display = "none";
        const meal = planningData[idx];
        if (!meal || meal.mealie_plan_sync === true) return;
        if (rowEl) rowEl.classList.add("loading");
        try {
          const r = await fetch(`/meal-planning/${encodeURIComponent(monday)}/regenerate`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ jour: meal.jour, repas: meal.repas, mode: mode || "vegetarien", ingredients })
          });
          if (!r.ok) {
            let detail = r.status;
            try {
              const payload = await r.json();
              if (payload && payload.detail) detail = payload.detail;
            } catch (_) {}
            throw new Error(detail);
          }
          const resp = await r.json();
          const newMeal = resp.meal || resp;
          planningData[idx] = newMeal;
          updateMealieMatchForIndex(idx);
          renderPlanning(planningData, idx);
          computeAllIngredients(planningData);
        } catch (e) {
          err.style.display = "block";
          err.textContent = "Génération impossible: " + (e && e.message ? e.message : e);
        } finally {
          if (rowEl) rowEl.classList.remove("loading");
        }
      }

      async function addRandomMealieDish(idx, rowEl) {
        err.style.display = "none";
        const meal = planningData[idx];
        if (!meal || meal.mealie_plan_sync === true) return;
        if (rowEl) rowEl.classList.add("loading");
        try {
          const r = await fetch(`/meal-planning/${encodeURIComponent(monday)}/regenerate-mealie`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ jour: meal.jour, repas: meal.repas })
          });
          if (!r.ok) {
            let detail = r.status;
            try {
              const payload = await r.json();
              if (payload && payload.detail) detail = payload.detail;
            } catch (_) {}
            throw new Error(detail);
          }
          const resp = await r.json();
          const newMeal = resp.meal || resp;
          planningData[idx] = newMeal;
          updateMealieMatchForIndex(idx);
          renderPlanning(planningData, idx);
          computeAllIngredients(planningData);
        } catch (e) {
          err.style.display = "block";
          err.textContent = "Ajout impossible: " + (e && e.message ? e.message : e);
        } finally {
          if (rowEl) rowEl.classList.remove("loading");
        }
      }

      async function addMealieDish(idx, rowEl, recipe) {
        err.style.display = "none";
        const meal = planningData[idx];
        if (!meal || meal.mealie_plan_sync === true || !recipe || !recipe.slug) return;
        if (rowEl) rowEl.classList.add("loading");
        try {
          const r = await fetch(`/meal-planning/${encodeURIComponent(monday)}/add-mealie-dish`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ jour: meal.jour, repas: meal.repas, slug: recipe.slug, name: recipe.name })
          });
          if (!r.ok) {
            let detail = r.status;
            try {
              const payload = await r.json();
              if (payload && payload.detail) detail = payload.detail;
            } catch (_) {}
            throw new Error(detail);
          }
          const resp = await r.json();
          const newMeal = resp.meal || resp;
          planningData[idx] = newMeal;
          updateMealieMatchForIndex(idx);
          renderPlanning(planningData, idx);
          computeAllIngredients(planningData);
        } catch (e) {
          err.style.display = "block";
          err.textContent = "Ajout impossible: " + (e && e.message ? e.message : e);
        } finally {
          if (rowEl) rowEl.classList.remove("loading");
        }
      }

      async function removeDish(idx, dish) {
        err.style.display = "none";
        const meal = planningData[idx];
        if (!meal || meal.mealie_plan_sync === true || !dish) return;
        try {
          const r = await fetch(`/meal-planning/${encodeURIComponent(monday)}/remove-dish`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ jour: meal.jour, repas: meal.repas, dish })
          });
          if (!r.ok) {
            let detail = r.status;
            try {
              const payload = await r.json();
              if (payload && payload.detail) detail = payload.detail;
            } catch (_) {}
            throw new Error(detail);
          }
          const resp = await r.json();
          const newMeal = resp.meal || resp;
          planningData[idx] = newMeal;
          updateMealieMatchForIndex(idx);
          renderPlanning(planningData, idx);
          computeAllIngredients(planningData);
        } catch (e) {
          err.style.display = "block";
          err.textContent = "Suppression impossible: " + (e && e.message ? e.message : e);
        }
      }

      async function loadMealieRecipes() {
        try {
          const r = await fetch(`/mealie/recipes`, { headers: { "Accept": "application/json" } });
          if (!r.ok) throw new Error("GET Mealie failed: " + r.status);
          const data = await r.json();
          if (!Array.isArray(data)) throw new Error("Invalid Mealie JSON");
          mealieRecipes = data;
        } catch (e) {
          mealieRecipes = [];
        }
      }

      createBtn.addEventListener("click", async () => {
        try {
          await persistCurrentList();
        } catch (e) {
          err.style.display = "block";
          err.textContent = String(e && e.message ? e.message : e);
        }
      });
      mobileShoppingAction.addEventListener("click", async () => {
        const url = `/meal-planning/${encodeURIComponent(monday)}/shopping-list`;
        if (hasSavedList) {
          location.href = url;
          return;
        }
        try {
          if (await persistCurrentList()) location.href = url;
        } catch (e) {
          err.style.display = "block";
          err.textContent = String(e && e.message ? e.message : e);
          window.scrollTo({ top: 0, behavior: "smooth" });
        }
      });

      const regenModalEl = document.getElementById("regenModal");
      const regenIngredientsWrap = document.getElementById("regenIngredientsWrap");
      const regenIngredientsInput = document.getElementById("regenIngredients");
      const regenConfirmBtn = document.getElementById("regenConfirm");
      const regenModeInputs = document.querySelectorAll('input[name="regenMode"]');

      function updateRegenIngredientsVisibility() {
        const mode = getSelectedRegenMode();
        if (regenIngredientsWrap) {
          regenIngredientsWrap.style.display = mode === "inspire" ? "block" : "none";
        }
        if (mode !== "inspire" && regenIngredientsInput) {
          regenIngredientsInput.value = "";
        }
      }

      regenModeInputs.forEach((input) => {
        input.addEventListener("change", updateRegenIngredientsVisibility);
      });
      updateRegenIngredientsVisibility();

      if (regenConfirmBtn) {
        regenConfirmBtn.addEventListener("click", () => {
          if (pendingRegenIdx === null) return;
          const mode = getSelectedRegenMode();
          const ingredients = mode === "inspire" && regenIngredientsInput ? regenIngredientsInput.value : "";
          if (regenModalEl) {
            const modal = bootstrap.Modal.getInstance(regenModalEl);
            if (modal) modal.hide();
          }
          regenerateMeal(pendingRegenIdx, pendingRegenRow, mode, ingredients);
          pendingRegenIdx = null;
          pendingRegenRow = null;
        });
      }

      async function main() {
        try {
          const r = await fetch(`/meal-planning/${encodeURIComponent(monday)}`, {
            headers: { "Accept": "application/json" }
          });
          if (!r.ok) throw new Error("GET JSON failed: " + r.status);
          planningData = await r.json();
          if (!Array.isArray(planningData)) throw new Error("Invalid JSON: not an array");
          await loadMealieRecipes();
          updateAllMealieMatches();
          renderPlanning(planningData);
          computeAllIngredients(planningData);
          await loadSavedListIfAny();
        } catch (e) {
          err.style.display = "block";
          err.textContent = String(e && e.message ? e.message : e);
        }
      }

      main();
    </script>
  </body>
</html>
