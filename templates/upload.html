<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Composer la semaine - {{ monday }}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root { --ink:#223027; --green:#276749; --line:#dae5d9; }
    body { color:var(--ink); background:#f5f7f3; padding-bottom:7rem; }
    .shell { max-width:1000px; }
    .step { font-size:.72rem; letter-spacing:.09em; text-transform:uppercase; font-weight:700; color:var(--green); }
    .day-card { border:1px solid var(--line); border-radius:18px; background:#fff; box-shadow:0 3px 14px rgba(28,53,35,.04); touch-action:pan-y; }
    .day-card h2 { text-transform:capitalize; font-size:1.1rem; }
    .day-card .btn { min-height:44px; }
    .recipe-name { font-weight:650; overflow-wrap:anywhere; }
    .score { color:#526558; font-size:.82rem; }
    .season-badge { display:flex; align-items:center; gap:.5rem; min-height:48px; }
    .season-badge img { width:96px; height:auto; flex:none; }
    .ingredient-detail summary { cursor:pointer; min-height:40px; display:flex; align-items:center; color:var(--green); font-size:.875rem; font-weight:600; }
    .ingredient-detail ul { list-style:none; padding:0; margin:0 0 .5rem; }
    .ingredient-detail li { display:flex; justify-content:space-between; gap:.75rem; padding:.35rem 0; border-top:1px solid #edf1ec; font-size:.85rem; }
    .ingredient-detail li span:last-child { white-space:nowrap; font-weight:600; }
    .suggestion-panel { position:relative; overflow:hidden; border-radius:12px; }
    .mealie-photo { display:block; width:100%; max-height:180px; margin:.4rem 0 .7rem; border-radius:12px; object-fit:cover; }
    .swipe-indicator { position:absolute; top:.35rem; right:.35rem; z-index:2; display:grid; place-items:center; width:44px; height:44px; border-radius:50%; background:#e5f3e9; color:var(--green); box-shadow:0 2px 10px #1c352326; font-size:2rem; line-height:1; opacity:0; transform:scale(.7); transition:opacity .12s ease,transform .12s ease; pointer-events:none; }
    .suggestion-panel.swiping .swipe-indicator { opacity:1; transform:scale(1); }
    .suggestion-panel.swiping .swipe-indicator span { animation:spin .8s linear infinite; }
    .suggestion-panel.swipe-out { animation:swipe-out .19s ease-in forwards; }
    .suggestion-panel.swipe-in { animation:swipe-in .23s ease-out; }
    @keyframes spin { to { transform:rotate(360deg); } }
    @keyframes swipe-out { to { opacity:0; transform:translateX(-42px); } }
    @keyframes swipe-in { from { opacity:0; transform:translateX(42px); } to { opacity:1; transform:translateX(0); } }
    @media (prefers-reduced-motion:reduce) { .swipe-indicator,.swipe-indicator span,.suggestion-panel { animation-duration:.01ms !important; transition-duration:.01ms !important; } }
    .sticky-actions { position:fixed; z-index:20; bottom:0; left:0; right:0; background:#fff; border-top:1px solid var(--line); padding:.7rem max(1rem, env(safe-area-inset-left)) calc(.7rem + env(safe-area-inset-bottom)); box-shadow:0 -6px 20px #1c352314; }
    .sticky-actions .btn { min-height:48px; }
    @media (min-width:768px) { body {padding-bottom:2rem;} .sticky-actions {position:static;box-shadow:none;border:0;background:transparent;padding:0;} }
  </style>
</head>
<body>
<div class="container shell py-3 py-md-4">
  <header class="mb-4">
    <div class="d-flex flex-wrap gap-3"><a class="small text-decoration-none fw-semibold" href="/meal-planning/">← Toutes les semaines</a><a class="small text-decoration-none fw-semibold" href="/mealie/catalog">Catalogue Mealie</a></div>
    <p class="step mt-4 mb-1">Nouvelle semaine · 7 dîners</p>
    <h1 class="h2 mb-2" id="weekTitle">Semaine du {{ monday }}</h1>
    <p class="text-muted mb-0">Choisissez vos recettes Mealie, puis laissez l’IA compléter les soirs libres.</p>
  </header>
  <div id="message" class="alert d-none" role="status"></div>
  <div id="calendarNote" class="alert alert-info d-none"></div>
  <div id="days" class="row g-3 mb-4" aria-live="polite"></div>
  <div class="sticky-actions d-flex flex-column flex-md-row gap-2 justify-content-md-end mb-md-4">
    <button id="complete" type="button" class="btn btn-outline-success fw-semibold">Compléter avec l’IA</button>
    <button id="confirm" type="button" class="btn btn-success fw-semibold">Valider la semaine</button>
  </div>
  <details class="card border-0 shadow-sm mt-4">
    <summary class="card-body fw-semibold" style="cursor:pointer;min-height:48px">Option avancée · importer un planning JSON</summary>
    <form class="card-body border-top" method="post" action="/meal-planning/{{ monday }}">
      <label class="form-label" for="planningJson">JSON du planning</label>
      <textarea class="form-control mb-3" id="planningJson" name="planning_json" rows="8" required></textarea>
      <button class="btn btn-outline-success" type="submit">Importer</button>
    </form>
  </details>
</div>
<script>
const monday = "{{ monday }}";
const base = `/meal-planning/${encodeURIComponent(monday)}`;
const names = ["lundi","mardi","mercredi","jeudi","vendredi","samedi","dimanche"];
const state = {data:null, busy:false, ingredientScores:new Map(), suggestionIndex:{}, animating:new Set()};
const $ = id => document.getElementById(id);
const start = new Date(`${monday}T12:00:00`), end = new Date(start); end.setDate(end.getDate()+6);
$("weekTitle").textContent = `Semaine du ${new Intl.DateTimeFormat("fr-FR",{day:"numeric",month:"long"}).format(start)} au ${new Intl.DateTimeFormat("fr-FR",{day:"numeric",month:"long",year:"numeric"}).format(end)}`;
function node(tag, cls, value) { const el=document.createElement(tag); if(cls) el.className=cls; if(value!==undefined) el.textContent=value; return el; }
function button(label, cls, action) {const el=node("button", `btn ${cls}`, label); el.type="button"; el.addEventListener("click",action); return el;}
function notice(message, error=false) {const el=$("message"); el.textContent=message; el.className=`alert ${error?"alert-danger":"alert-success"}`; el.scrollIntoView({block:"nearest"});}
async function request(path, method="GET", body) {const response=await fetch(base+path,{method,headers:body?{"Content-Type":"application/json"}:{},body:body?JSON.stringify(body):undefined}); if(!response.ok){let message=`Erreur ${response.status}`; try{message=(await response.json()).detail||message;}catch(_){} throw new Error(message);}return response.json();}
function seasonBadge(item) {
  const s=item?.seasonality, wrap=node("div","season-badge mb-2");
  if(s?.grade && /^[ABCDE]$/.test(s.grade)) {const img=node("img"); img.src=`/img/${s.grade}.png`; img.alt=`Season-score ${s.grade}`; img.width=96; img.height=50; wrap.append(img);}
  const label=s?.relevant===0 ? "Aucun ingrédient saisonnier à évaluer" : !s || s.score===null ? "Saison non évaluée" : `Season-score ${s.grade} · ${s.evaluated}/${s.relevant} ingrédients évalués`;
  wrap.append(node("span","score",label));
  return wrap;
}
function recipePhoto(item) {
  if(!item?.image_url)return null;
  const photo=node("img","mealie-photo");photo.src=item.image_url;photo.alt=`Photo de ${item.name||"la recette"}`;photo.loading="lazy";
  photo.addEventListener("error",()=>photo.remove());return photo;
}
function ingredientLabel(item) {
  if(item.status==="neutral") return "Neutre";
  if(item.status==="unknown") return "Non évalué";
  return ["0/2 · hors saison","1/2 · disponible","2/2 · pleine saison"][item.score] || "Non évalué";
}
function ingredientDetail(day,item) {
  const details=node("details","ingredient-detail mb-2"); details.append(node("summary","","Scores des ingrédients"));
  const content=node("div","small text-muted","Chargement…"); details.append(content);
  details.addEventListener("toggle",async()=>{
    if(!details.open) return;
    const key=`${day}:${item.slug}`;
    try {
      if(!state.ingredientScores.has(key)) state.ingredientScores.set(key,await request(`/draft/recipe-seasonality/${encodeURIComponent(item.slug)}?day=${encodeURIComponent(day)}`));
      const ingredients=state.ingredientScores.get(key).ingredients;
      const list=node("ul");
      for(const ingredient of ingredients) {const row=node("li"); const name=ingredient.display||ingredient.name; row.append(node("span","",name),node("span","",ingredientLabel(ingredient))); list.append(row);}
      content.replaceChildren(list);
      if(!ingredients.length) content.textContent="Aucun ingrédient renseigné dans Mealie.";
    } catch(error) {content.textContent=error.message;}
  });
  return details;
}
function availableSuggestions(day) {
  const used=new Set(Object.entries(state.data.choices).filter(([other])=>other!==day).map(([,meal])=>meal.mealie_slug).filter(Boolean));
  for(const meal of state.data.locked)for(const dish of meal.mealie_dishes||[])if(dish.slug)used.add(dish.slug);
  return (state.data.suggestions[day]||[]).filter(item=>!used.has(item.slug));
}
function nextSuggestion(day) {
  if(state.animating.has(day)) return;
  const panel=document.querySelector(`[data-suggestion-day="${day}"]`);
  if(!panel) return;
  const restoreFocus=document.activeElement===panel;
  state.animating.add(day);
  panel.classList.remove("swiping");
  panel.classList.add("swipe-out");
  setTimeout(()=>{
    state.suggestionIndex[day]=(state.suggestionIndex[day]||0)+1;
    render();
    const replacement=document.querySelector(`[data-suggestion-day="${day}"]`);
    if(replacement) {replacement.classList.add("swipe-in");if(restoreFocus)replacement.focus({preventScroll:true});}
    setTimeout(()=>{replacement?.classList.remove("swipe-in");state.animating.delete(day);},230);
  },190);
}
function recipeLabel(meal) {return (meal?.plats||[]).join(" · ") || "Repas sans titre";}
function render() {
  const data=state.data; if(!data)return;
  const locked=new Map(data.locked.filter(m=>m.repas==="soir").map(m=>[m.jour,m]));
  const other=data.locked.filter(m=>m.repas!=="soir");
  const note=$("calendarNote"); note.classList.toggle("d-none",other.length===0); note.textContent=other.length?`Autres repas du calendrier Mealie : ${other.map(m=>`${m.jour} ${m.repas} — ${recipeLabel(m)}`).join(" ; ")}`:"";
  const container=$("days"); container.replaceChildren();
  names.forEach((day,index)=>{
    const col=node("div","col-12 col-md-6"); const card=node("section","day-card h-100 p-3"); col.append(card);
    const date=new Date(start); date.setDate(date.getDate()+index);
    card.append(node("h2","mb-2",`${day} ${new Intl.DateTimeFormat("fr-FR",{day:"numeric",month:"short"}).format(date)}`));
    const fixed=locked.get(day), choice=data.choices[day], generated=data.generated[day], selected=fixed||choice||generated;
    if(fixed) card.append(node("span","badge text-bg-success mb-2","🔒 Calendrier Mealie"));
    else if(choice) card.append(node("span","badge text-bg-success mb-2","Recette Mealie choisie"));
    else if(generated) card.append(node("span","badge text-bg-secondary mb-2","Proposition IA · à relire"));
    if(selected) {
      card.append(node("div","recipe-name mb-2",recipeLabel(selected)));
      if(fixed)for(const dish of fixed.mealie_dishes||[]){const imageUrl=data.mealie_images?.[dish.slug];if(imageUrl){const photo=recipePhoto({image_url:imageUrl,name:dish.name});if(photo)card.append(photo);}}
      if(selected.ingredients?.length) card.append(node("p","text-muted small mb-2",selected.ingredients.join(", ")));
    }
    if(choice?.mealie_slug) {const item=data.suggestions[day]?.find(r=>r.slug===choice.mealie_slug); if(item) {const photo=recipePhoto(item);if(photo)card.append(photo);card.append(seasonBadge(item),ingredientDetail(day,item));}}
    if(data.conflicts.includes(day)) card.append(node("p","text-danger small", "Conflit : retirez votre ancien choix pour garder le repas du calendrier Mealie."));
    if(fixed) {if(data.conflicts.includes(day)) card.append(button("Retirer mon ancien choix","btn-outline-danger w-100",()=>choose(day,null))); container.append(col); return;}
    const options=availableSuggestions(day);
    const suggestion=options.length?options[(state.suggestionIndex[day]||0)%options.length]:null;
    if(!selected && suggestion){
      const panel=node("div","suggestion-panel");
      panel.dataset.suggestionDay=day;
      panel.append(node("div","small text-muted mb-1","Suggestion Mealie · season-score C ou mieux"));
      panel.append(node("div","recipe-name",suggestion.name));
      const photo=recipePhoto(suggestion);if(photo)panel.append(photo);
      panel.append(seasonBadge(suggestion),ingredientDetail(day,suggestion));
      panel.append(button("Ajouter cette recette","btn-outline-success w-100 mb-2",()=>choose(day,suggestion.slug)));
      if(options.length>1){
        panel.append(node("div","text-muted small mb-2",`Glissez vers la gauche · ${(state.suggestionIndex[day]||0)%options.length+1}/${options.length}`));
        const indicator=node("span","swipe-indicator");indicator.append(node("span","","↻"));panel.append(indicator);
        panel.tabIndex=0;
        panel.setAttribute("role","group");
        panel.setAttribute("aria-label",`Suggestion pour ${day}. Glissez vers la gauche ou utilisez la flèche gauche pour voir une autre recette.`);
        panel.addEventListener("keydown",event=>{if(event.target===panel&&event.key==="ArrowLeft"){event.preventDefault();nextSuggestion(day);}});
        let gesture=null;
        panel.addEventListener("touchstart",event=>{if(event.touches.length!==1||event.target.closest("button, details"))return;gesture={x:event.touches[0].clientX,y:event.touches[0].clientY,mostLeft:0,reversing:false};},{passive:true});
        panel.addEventListener("touchmove",event=>{if(!gesture)return;const dx=event.touches[0].clientX-gesture.x,dy=event.touches[0].clientY-gesture.y;gesture.mostLeft=Math.min(gesture.mostLeft,dx);gesture.reversing=dx>gesture.mostLeft+12;panel.classList.toggle("swiping",dx<-12&&Math.abs(dx)>Math.abs(dy)*1.2&&!gesture.reversing);},{passive:true});
        panel.addEventListener("touchend",event=>{if(!gesture)return;const dx=event.changedTouches[0].clientX-gesture.x,dy=event.changedTouches[0].clientY-gesture.y,reversing=gesture.reversing;gesture=null;panel.classList.remove("swiping");if(dx<-60&&Math.abs(dx)>Math.abs(dy)*1.2&&!reversing)nextSuggestion(day);},{passive:true});
        panel.addEventListener("touchcancel",()=>{gesture=null;panel.classList.remove("swiping");},{passive:true});
      }
      card.append(panel);
    }
    if(!selected && !suggestion) card.append(node("p","text-muted small","Aucune recette Mealie disponible. L’IA pourra compléter ce dîner."));
    if(choice||generated) card.append(button(choice?"Retirer cette recette":"Retirer cette proposition IA","btn-link text-secondary w-100",()=>choose(day,null)));
    container.append(col);
  });
  const available=names.some(day=>!locked.has(day)&&!data.choices[day]&&!data.generated[day]);
  $("complete").disabled=state.busy||!available||data.conflicts.length>0;
  $("confirm").disabled=state.busy||available||data.conflicts.length>0;
}
async function choose(day,slug){try{state.data=await request("/draft/choice","POST",{day,slug});render();}catch(error){notice(error.message,true);}}
$("complete").addEventListener("click",async()=>{state.busy=true;render();$("complete").textContent="Génération en cours…";try{state.data=await request("/draft/complete","POST");render();notice("Propositions IA prêtes : relisez-les avant de valider.");}catch(error){notice(error.message,true);}finally{state.busy=false;$("complete").textContent="Compléter avec l’IA";render();}});
$("confirm").addEventListener("click",async()=>{state.busy=true;render();try{await request("/draft/confirm","POST");location.href=base;}catch(error){notice(error.message,true);try{state.data=await request("/draft");}catch(_){}state.busy=false;render();}});
(async()=>{try{state.data=await request("/draft");render();}catch(error){notice(error.message,true);}})();
</script>
</body>
</html>
