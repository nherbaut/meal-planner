<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Liste de courses - {{ monday }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <style>
      body { background: #f5f7f3; color: #223027; }
      .page-shell { max-width: 1100px; }
      .shopping-section { border: 1px solid #e1e8df; border-radius: 18px; }
      .shopping-item { gap: .75rem; }
      .shopping-item > span { min-width: 0; overflow-wrap: anywhere; }
      .shopping-item .btn { min-height: 44px; flex: none; }
      .form-check-input { width: 1.25rem; height: 1.25rem; }
      .form-check-label { padding-top: .15rem; }
    </style>
  </head>
  <body>
    <div class="container page-shell py-3 py-lg-4">
      <header class="mb-4">
        <a class="small text-decoration-none fw-semibold" href="/meal-planning/{{ monday }}">← Retour au planning</a>
        <div class="small text-uppercase fw-semibold text-success mt-3 mb-1">À acheter cette semaine</div>
        <h1 class="h2 mb-0" id="shoppingTitle">Liste de courses · {{ monday }}</h1>
      </header>
      <div id="err" class="text-danger small mb-2" style="display:none;"></div>
      <div class="d-flex align-items-center gap-2 mb-3">
        <div class="form-check form-switch">
          <input class="form-check-input" type="checkbox" id="toggleView" />
          <label class="form-check-label" for="toggleView">Vue par jour</label>
        </div>
      </div>
      <div id="standardView" class="row g-3">
        <div class="col-12 col-lg-6">
          <div class="card shopping-section shadow-sm">
            <div class="card-body">
              <div class="d-flex justify-content-between align-items-center mb-2">
                <h2 class="h6 mb-0">À acheter</h2>
                <span class="badge bg-primary" id="toBuyCount">0</span>
              </div>
              <div id="toBuy"></div>
              <div class="text-muted small mt-2" id="toBuyEmpty" style="display:none;">Rien à acheter.</div>
            </div>
          </div>
        </div>
        <div class="col-12 col-lg-6">
          <div class="card shopping-section shadow-sm">
            <div class="card-body">
              <div class="d-flex justify-content-between align-items-center mb-2">
                <h2 class="h6 mb-0">Déjà acheté</h2>
                <span class="badge bg-success" id="boughtCount">0</span>
              </div>
              <div id="bought"></div>
              <div class="text-muted small mt-2" id="boughtEmpty" style="display:none;">Rien dans cette zone.</div>
            </div>
          </div>
        </div>
      </div>

      <div id="perDayView" class="row g-3" style="display:none;">
        <div class="col-12">
          <div class="accordion" id="perDayAcc"></div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      const monday = "{{ monday }}";
      const weekStart = new Date(`${monday}T12:00:00`);
      const weekEnd = new Date(weekStart);
      weekEnd.setDate(weekStart.getDate() + 6);
      const first = new Intl.DateTimeFormat("fr-FR", { day: "numeric", month: weekStart.getMonth() === weekEnd.getMonth() ? undefined : "long", year: weekStart.getFullYear() === weekEnd.getFullYear() ? undefined : "numeric" }).format(weekStart);
      const last = new Intl.DateTimeFormat("fr-FR", { day: "numeric", month: "long", year: "numeric" }).format(weekEnd);
      document.getElementById("shoppingTitle").textContent = `Liste de courses · ${first}–${last}`;
      const initialToBuy = {{ to_buy|tojson }};
      const initialBought = {{ bought|tojson }};
      const notes = {{ notes|tojson }};
      const toBuyDiv = document.getElementById("toBuy");
      const boughtDiv = document.getElementById("bought");
      const toBuyEmpty = document.getElementById("toBuyEmpty");
      const boughtEmpty = document.getElementById("boughtEmpty");
      const toBuyCount = document.getElementById("toBuyCount");
      const boughtCount = document.getElementById("boughtCount");
      const err = document.getElementById("err");
      const toggleView = document.getElementById("toggleView");
      const perDayView = document.getElementById("perDayView");
      const perDayAcc = document.getElementById("perDayAcc");
      const standardView = document.getElementById("standardView");
      const perDayAddToBuy = document.getElementById("perDayAddToBuy");
      const perDayMarkBought = document.getElementById("perDayMarkBought");
      const planningData = {{ planning|tojson }};

      const toBuy = new Set();
      const bought = new Set();
      const norm = s => String(s || "").trim().toLowerCase();

      for (const it of initialToBuy || []) {
        const v = String(it || "").trim();
        if (v) toBuy.add(v);
      }
      for (const it of initialBought || []) {
        const v = String(it || "").trim();
        if (v) bought.add(v);
      }

      function setError(msg) {
        if (!err) return;
        if (!msg) {
          err.style.display = "none";
          err.textContent = "";
          return;
        }
        err.style.display = "block";
        err.textContent = msg;
      }

      function renderLists() {
        toBuyDiv.innerHTML = "";
        boughtDiv.innerHTML = "";

        const toBuyArr = [...toBuy].sort((a, b) => a.localeCompare(b, "fr"));
        const boughtArr = [...bought].sort((a, b) => a.localeCompare(b, "fr"));

        toBuyEmpty.style.display = toBuyArr.length ? "none" : "block";
        boughtEmpty.style.display = boughtArr.length ? "none" : "block";

        toBuyCount.textContent = `${toBuyArr.length}`;
        boughtCount.textContent = `${boughtArr.length}`;

        for (const ing of toBuyArr) {
          const row = document.createElement("div");
          row.className = "d-flex align-items-center justify-content-between border rounded p-2 mb-2 bg-white shopping-item";
          const span = document.createElement("span");
          span.className = "d-flex flex-column";
          const label = document.createElement("span");
          label.textContent = ing;
          span.appendChild(label);
          if (notes && notes[ing.toLowerCase()]) {
            const note = document.createElement("span");
            note.className = "text-muted small fst-italic";
            note.textContent = notes[ing.toLowerCase()];
            span.appendChild(note);
          }
          const btn = document.createElement("button");
          btn.className = "btn btn-sm btn-outline-danger";
          btn.type = "button";
          btn.textContent = "Acheté";
          btn.addEventListener("click", () => updateItem(ing, "bought"));
          row.appendChild(span);
          row.appendChild(btn);
          toBuyDiv.appendChild(row);
        }

        for (const ing of boughtArr) {
          const row = document.createElement("div");
          row.className = "d-flex align-items-center justify-content-between border rounded p-2 mb-2 bg-white shopping-item";
          const span = document.createElement("span");
          span.className = "d-flex flex-column";
          const label = document.createElement("span");
          label.textContent = ing;
          span.appendChild(label);
          if (notes && notes[ing.toLowerCase()]) {
            const note = document.createElement("span");
            note.className = "text-muted small fst-italic";
            note.textContent = notes[ing.toLowerCase()];
            span.appendChild(note);
          }
          const btn = document.createElement("button");
          btn.className = "btn btn-sm btn-outline-success";
          btn.type = "button";
          btn.textContent = "À acheter";
          btn.addEventListener("click", () => updateItem(ing, "to_buy"));
          row.appendChild(span);
          row.appendChild(btn);
          boughtDiv.appendChild(row);
        }
      }

      renderLists();

      function renderPerDay() {
        const openIds = new Set(Array.from(perDayAcc.querySelectorAll(".accordion-collapse.show")).map(el => el.id));
        perDayAcc.innerHTML = "";
        if (!Array.isArray(planningData) || planningData.length === 0) {
          perDayAcc.innerHTML = '<div class="text-muted small">Pas de planning chargé.</div>';
          return;
        }
        const order = new Map([["lundi", 1], ["mardi", 2], ["mercredi", 3], ["jeudi", 4], ["vendredi", 5], ["samedi", 6], ["dimanche", 7]]);
        const buySet = new Set([...toBuy].map(norm));
        const boughtSet = new Set([...bought].map(norm));
        const items = planningData
          .filter(m => (m.repas || "").toLowerCase() === "soir")
          .map((m, idx) => ({ meal: m, idx }))
          .sort((a, b) => (order.get((a.meal.jour || "").toLowerCase()) || 999) - (order.get((b.meal.jour || "").toLowerCase()) || 999));

        items.forEach(({ meal }, i) => {
          const itemId = `day-${i}`;
          const card = document.createElement("div");
          card.className = "accordion-item";

          const h = document.createElement("h2");
          h.className = "accordion-header";
          const btn = document.createElement("button");
          const isOpen = openIds.has(itemId);
          btn.className = isOpen ? "accordion-button" : "accordion-button collapsed";
          btn.type = "button";
          btn.setAttribute("data-bs-toggle", "collapse");
          btn.setAttribute("data-bs-target", `#${itemId}`);
          btn.innerHTML = `<div class="me-2 fw-semibold text-capitalize">${meal.jour || ""}</div><div class="small text-muted">${(Array.isArray(meal.plats) ? meal.plats.join(", ") : "")}</div>`;
          h.appendChild(btn);
          card.appendChild(h);

          const body = document.createElement("div");
          body.id = itemId;
          body.className = isOpen ? "accordion-collapse collapse show" : "accordion-collapse collapse";

          const inner = document.createElement("div");
          inner.className = "accordion-body";
          const ing = Array.isArray(meal.ingredients) ? meal.ingredients : (Array.isArray(meal.courses) ? meal.courses : []);
          if (!ing.length) {
            inner.innerHTML = '<div class="text-muted small">Aucun ingrédient.</div>';
          } else {
            ing.forEach(val => {
              const k = norm(val);
              if (!buySet.has(k) && !boughtSet.has(k)) {
                return; // ignorer les ingrédients non présents dans la liste de courses
              }
              const row = document.createElement("div");
              row.className = "d-flex justify-content-between align-items-center border rounded p-2 mb-2";
              const left = document.createElement("div");
              left.className = "d-flex flex-column";
              const label = document.createElement("span");
              label.textContent = val;
              left.appendChild(label);
              if (notes && notes[k]) {
                const note = document.createElement("span");
                note.className = "text-muted small fst-italic";
                note.textContent = notes[k];
                left.appendChild(note);
              }
              const btn = document.createElement("button");
              btn.setAttribute("type", "button");
              btn.className = boughtSet.has(k) ? "btn btn-sm btn-outline-success" : "btn btn-sm btn-outline-danger";
              btn.textContent = boughtSet.has(k) ? "À acheter" : "Acheté";
              btn.addEventListener("click", (evt) => {
                evt.stopPropagation(); // éviter de replier l'accordéon
                updateItem(val, boughtSet.has(k) ? "to_buy" : "bought");
              });
              row.appendChild(left);
              row.appendChild(btn);
          inner.appendChild(row);
        });
      }
          body.appendChild(inner);
          card.appendChild(body);
          perDayAcc.appendChild(card);

          if (openIds.has(itemId)) {
            const collapse = new bootstrap.Collapse(body, { toggle: false });
            collapse.show();
          }
        });
      }

      perDayAddToBuy?.addEventListener("click", () => {
        // no-op placeholder: actions spécifiques si besoin
      });
      perDayMarkBought?.addEventListener("click", () => {
        // no-op placeholder
      });

      toggleView.addEventListener("change", () => {
        if (toggleView.checked) {
          standardView.style.display = "none";
          perDayView.style.display = "flex";
          renderPerDay();
        } else {
          perDayView.style.display = "none";
          standardView.style.display = "flex";
        }
      });

      async function persist() {
        setError("");
        try {
          const payload = {
            to_buy: [...toBuy],
            bought: [...bought],
            notes: notes,
          };
          const r = await fetch(`/meal-planning/${encodeURIComponent(monday)}/shopping-list`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
          });
          if (!r.ok) {
            let detail = r.status;
            try {
              const data = await r.json();
              if (data && data.detail) detail = data.detail;
            } catch (_) {}
            throw new Error(detail);
          }
        } catch (e) {
          setError("Sauvegarde impossible: " + (e && e.message ? e.message : e));
        }
      }

      function updateItem(ing, target) {
        const label = String(ing || "").trim();
        const k = norm(label);
        if (!k) return;
        if (target === "bought") {
          toBuy.forEach(x => { if (norm(x) === k) toBuy.delete(x); });
          bought.add(label);
        } else {
          bought.forEach(x => { if (norm(x) === k) bought.delete(x); });
          toBuy.add(label);
        }
        renderLists();
        if (toggleView.checked) renderPerDay();
        persist();
      }
    </script>
  </body>
</html>
